<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1620" viewBox="0 0 1460 1620" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif"><defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="20" y="70" width="280" height="1430" fill="#EAF3FB" stroke="#222222" stroke-width="1"/><line x1="20" y1="110" x2="300" y2="110" stroke="#222222" stroke-width="1"/><text font-size="15" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#222222"><tspan x="160.0" y="90.0">Visitante</tspan></text><rect x="300" y="70" width="500" height="1430" fill="#F1ECF8" stroke="#222222" stroke-width="1"/><line x1="300" y1="110" x2="800" y2="110" stroke="#222222" stroke-width="1"/><text font-size="15" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#222222"><tspan x="550.0" y="90.0">Site (navegador)</tspan></text><rect x="800" y="70" width="360" height="1430" fill="#FDF2E6" stroke="#222222" stroke-width="1"/><line x1="800" y1="110" x2="1160" y2="110" stroke="#222222" stroke-width="1"/><text font-size="15" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#222222"><tspan x="980.0" y="90.0">API (Render)</tspan></text><rect x="1160" y="70" width="280" height="1430" fill="#EAF6EE" stroke="#222222" stroke-width="1"/><line x1="1160" y1="110" x2="1440" y2="110" stroke="#222222" stroke-width="1"/><text font-size="15" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#222222"><tspan x="1300.0" y="90.0">IRSA (NASA)</tspan></text><text font-size="20" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#222222"><tspan x="730.0" y="36.0">SPHEREx Viewer — visão geral</tspan></text><circle cx="160" cy="145" r="10" fill="#222222"/><polyline points="160,155 160,180" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#seta)"/><rect x="50.0" y="180.0" width="220" height="50" rx="12" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/><text font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#222222"><tspan x="160" y="197.2">Abre o site ou um</tspan><tspan x="160" y="212.8">link compartilhado</tspan></text><polyline points="160,230 160,285 410,285" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#seta)"/><rect x="410.0" y="260.0" width="280" height="50" rx="12" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/><text font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#222222"><tspan x="550" y="277.2">Lê o estado da URL</tspan><tspan x="550" y="292.8">(alvo, coordenada, detector, modo)</tspan></text><polyline points="550,310 550,343" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#seta)"/><polygon points="440.0,365 456.0,343.0 644.0,343.0 660.0,365 644.0,387.0 456.0,387.0" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/><text font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#222222"><tspan x="550" y="365.0">Alvo pré-processado?</tspan></text><polyline points="440,365 420,365 420,420" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#seta)"/><text font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#555555"><tspan x="390" y="355.0">sim</tspan></text><rect x="320.0" y="420.0" width="200" height="50" rx="12" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/><text font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#222222"><tspan x="420" y="437.2">Carrega o campo publicado</tspan><tspan x="420" y="452.8">(GitHub Pages, sem fila)</tspan></text><polyline points="660,365 980,365 980,420" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#seta)"/><text font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#555555"><tspan x="670" y="355.0">não</tspan></text><rect x="870.0" y="420.0" width="220" height="50" rx="12" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/><text font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#222222"><tspan x="980" y="437.2">Recebe GET /api/v1/field</tspan><tspan x="980" y="452.8">e valida a coordenada</tspan></text><polyline points="980,470 980,503" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#seta)"/><polygon points="865.0,525 881.0,503.0 1079.0,503.0 1095.0,525 1079.0,547.0 881.0,547.0" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/><text font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#222222"><tspan x="980" y="525.0">Servidor ocupado (429)?</tspan></text><polyline points="865,525 680,525 680,575" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#seta)"/><text font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#555555"><tspan x="830" y="515.0">sim</tspan></text><rect x="575.0" y="575.0" width="210" height="50" rx="12" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/><text font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#222222"><tspan x="680" y="592.2">Mostra “servidor ocupado”</tspan><tspan x="680" y="607.8">e espera o Retry-After</tspan></text><polyline points="575,600 560,600 560,425 870,425" fill="none" stroke="#222222" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#seta)"/><text font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#555555"><tspan x="568" y="512.0">tenta de novo</tspan></text><polyline points="980,547 980,625" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#seta)"/><text font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#555555"><tspan x="988" y="575.0">não</tspan></text><rect x="865.0" y="625.0" width="230" height="50" rx="12" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/><text font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#222222"><tspan x="980" y="642.2">Cria o trabalho</tspan><tspan x="980" y="657.8">(202 + progresso a cada 2 s)</tspan></text><polyline points="980,675 980,700 1180,700" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#seta)"/><rect x="1180.0" y="675.0" width="240" height="50" rx="12" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/><text font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#222222"><tspan x="1300" y="692.2">Lista as exposições (TAP ou SIA)</tspan><tspan x="1300" y="707.8">e entrega os recortes</tspan></text><polyline points="1300,725 1300,780 1080,780" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#seta)"/><polygon points="880.0,780 896.0,758.0 1064.0,758.0 1080.0,780 1064.0,802.0 896.0,802.0" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/><text font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#222222"><tspan x="980" y="780.0">IRSA respondeu?</tspan></text><polyline points="880,780 680,780 680,815" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#seta)"/><text font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#555555"><tspan x="845" y="770.0">não</tspan></text><rect x="585.0" y="815.0" width="190" height="50" rx="12" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/><text font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#222222"><tspan x="680" y="832.2">Mostra aviso de</tspan><tspan x="680" y="847.8">instabilidade (502)</tspan></text><polyline points="680,865 680,899" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#seta)"/><circle cx="680" cy="910" r="11" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="680" cy="910" r="7" fill="#222222"/><polyline points="980,802 980,845" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#seta)"/><text font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#555555"><tspan x="988" y="822.0">sim</tspan></text><rect x="860.0" y="845.0" width="240" height="50" rx="12" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/><text font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#222222"><tspan x="980" y="862.2">Alinha, descarta flags,</tspan><tspan x="980" y="877.8">soma por época e grava o campo</tspan></text><polyline points="420,470 420,990 538,990" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#seta)"/><polyline points="980,895 980,990 562,990" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#seta)"/><polygon points="538,990 550,978 562,990 550,1002" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/><polyline points="550,1002 550,1045" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#seta)"/><rect x="415.0" y="1045.0" width="270" height="50" rx="12" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/><text font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#222222"><tspan x="550" y="1062.2">Decodifica os quadros e ajusta</tspan><tspan x="550" y="1077.8">o contraste no alvo</tspan></text><polyline points="550,1095 550,1150 285,1150" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#seta)"/><rect x="35.0" y="1125.0" width="250" height="50" rx="12" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/><text font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#222222"><tspan x="160" y="1142.2">Anima, pisca, subtrai ou soma</tspan><tspan x="160" y="1157.8">as épocas; troca o detector</tspan></text><polyline points="160,1175 160,1208" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#seta)"/><polygon points="60.0,1230 76.0,1208.0 244.0,1208.0 260.0,1230 244.0,1252.0 76.0,1252.0" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/><text font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#222222"><tspan x="160" y="1230.0">Quer o espectro?</tspan></text><polyline points="260,1230 400,1230" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#seta)"/><text font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#555555"><tspan x="270" y="1220.0">sim</tspan></text><rect x="400.0" y="1205.0" width="300" height="50" rx="12" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/><text font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#222222"><tspan x="550" y="1222.2">Desenha o espectro de 0,75 a 5 µm</tspan><tspan x="550" y="1237.8">e avisa sobre estrelas vizinhas</tspan></text><polyline points="550,1255 550,1310 172,1310" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#seta)"/><polyline points="160,1252 160,1298" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#seta)"/><text font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#555555"><tspan x="168" y="1275.0">não</tspan></text><polygon points="148,1310 160,1298 172,1310 160,1322" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/><polyline points="160,1322 160,1365" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#seta)"/><rect x="60.0" y="1365.0" width="200" height="50" rx="12" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/><text font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#222222"><tspan x="160" y="1382.2">Copia o link para</tspan><tspan x="160" y="1397.8">compartilhar o estado</tspan></text><polyline points="160,1415 160,1449" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#seta)"/><circle cx="160" cy="1460" r="11" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="160" cy="1460" r="7" fill="#222222"/><path d="M20,1520 h1404 l16,16 v66 h-1420 z" fill="#FBFBE6" stroke="#222222" stroke-width="1"/><text font-size="13" font-weight="bold" text-anchor="start" dominant-baseline="middle" fill="#222222"><tspan x="36" y="1540.0">Também pode acontecer:</tspan></text><text font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#555555"><tspan x="36" y="1560.8">coordenada inválida (400) · nenhuma exposição cobre o ponto (404) · o trabalho passa de 30 min (502) · uma exposição falha e vira lacuna declarada no campo · busca por nome passa pelo SIMBAD antes da API.</tspan><tspan x="36" y="1575.2">Veja o fluxo detalhado em fluxo-do-sistema.drawio (consulta ao vivo e atualização agendada).</tspan></text></svg>
