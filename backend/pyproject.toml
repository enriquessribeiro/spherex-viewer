[project]
name = "spherex-viewer"
version = "0.1.0"
description = "Pipeline e API do SPHEREx Viewer (NASA Space Apps 2026 - Planet X and SPHEREx)"
requires-python = ">=3.12"
dependencies = [
    "astropy>=7.0",
    "httpx>=0.28.1",
    "numpy>=2.0",
    "reproject>=0.14",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not science'"
markers = [
    "live: acessa o IRSA real pela rede",
    "science: validação científica com dados reais (lenta, usa rede)",
]
