[project]
name = "spherex-viewer"
version = "0.1.0"
description = "Pipeline e API do SPHEREx Viewer (NASA Space Apps 2026 - Planet X and SPHEREx)"
requires-python = ">=3.12"
dependencies = [
    "astropy>=7.0",
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "numpy>=2.0",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "reproject>=0.14",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not science'"
filterwarnings = [
    # Aviso interno do Starlette sobre o cliente de testes; não afeta o comportamento.
    "ignore::DeprecationWarning:fastapi.testclient",
    "ignore:Using `httpx` with `starlette.testclient`",
]
markers = [
    "live: acessa o IRSA real pela rede",
    "science: validação científica com dados reais (lenta, usa rede)",
]
