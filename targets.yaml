# Alvos pré-processados (docs/05-hospedagem.md §6). Os 5 primeiros são os testes do desafio.
#
# Posições e movimentos próprios: SIMBAD (consultado em 14/11/2026), época J2000
# (ref_mjd 51544.5). pm_ra_masyr é mu_alpha* (já multiplicado por cos(dec)).
# description e look_for aparecem nos cards do site: texto para quem não é astrônomo, sem números.
# O centro do campo é a posição propagada para a época das observações SPHEREx.

targets:
  - id: barnard
    name: "Barnard's Star"
    description: "Uma das estrelas mais próximas do Sol. É uma anã vermelha: menor, mais fria e bem mais fraca que o Sol, invisível a olho nu."
    look_for: "É a estrela que mais rápido muda de lugar no nosso céu. Veja o ponto subir de uma época para a outra."
    ra: 269.4520769586187
    dec: 4.693364966576667
    pm_ra_masyr: -801.551
    pm_dec_masyr: 10362.394
    fov_arcmin: 6

  - id: epsindib
    name: "Epsilon Indi B"
    description: "Duas anãs marrons que giram uma em volta da outra e acompanham a estrela Epsilon Indi. Anãs marrons são grandes demais para ser planetas e pequenas demais para brilhar como estrelas."
    look_for: "O par aparece como um só ponto, que muda de lugar entre as épocas."
    ra: 331.04414658852124
    dec: -56.782844195116105
    pm_ra_masyr: 3981.977
    pm_dec_masyr: -2466.832
    fov_arcmin: 6  # ε Indi A fica ~6,7′ a oeste, fora do campo

  - id: wise0855
    name: "WISE 0855-0714"
    description: "A anã marrom mais fria que se conhece, com temperatura parecida com a de um dia frio aqui na Terra. Não emite luz visível e é um dos vizinhos mais próximos do Sol."
    look_for: "Só aparece no infravermelho mais longo (detectores D5 e D6), andando dentro do círculo."
    ra: 133.81890825
    dec: -7.247048
    pm_ra_masyr: -8123.7
    pm_dec_masyr: 673.2
    fov_arcmin: 6
    default_detector: D6  # a 285 K só aparece em 4–5 µm

  - id: rwaur
    name: "RW Aurigae"
    description: "Uma estrela muito jovem, ainda cercada pelo disco de gás e poeira onde planetas podem estar se formando. O disco às vezes encobre parte da luz dela."
    look_for: "Ela fica parada, mas o brilho muda de uma época para a outra. Experimente o modo Diferença."
    ra: 76.95652603458333
    dec: 30.401438173888888
    pm_ra_masyr: 7.23
    pm_dec_masyr: -20.33
    fov_arcmin: 6

  - id: rdra
    name: "R Draconis"
    description: "Uma estrela gigante e velha, perto do fim da vida, que incha e encolhe em ciclos de alguns meses, como se respirasse."
    look_for: "O brilho muda bastante de uma época para a outra; a posição não muda."
    ra: 248.16761083295
    dec: 66.75497941722
    pm_ra_masyr: -20.643
    pm_dec_masyr: 6.149
    fov_arcmin: 6
